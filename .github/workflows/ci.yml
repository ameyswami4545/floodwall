name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test --all
      - name: build
        run: cargo build --release
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: install
        run: npm --prefix site ci
      - name: check
        run: npm --prefix site run check
      # `check` rebuilds the site into docs/, which GitHub Pages serves. Any
      # difference from what is committed means docs/ was not rebuilt after a
      # change to site/.
      - name: docs in sync
        run: |
          if [ -n "$(git status --porcelain -- docs)" ]; then
            echo "::error::docs/ is out of date with site/. Run 'npm --prefix site run build' and commit docs/."
            git status --short -- docs
            exit 1
          fi
